[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-house-research-toolkit"
version = "0.1.0"
description = "Open-source Python research toolkit for analysing environmental and IoT sensor data from the DigiTech Smart House Data Pack."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88